[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powerworld-tplan-tools"
version = "0.0.5"
description = "PowerWorld transmission planning helper functions"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    {name = "Joshua Xia"}
]

[tool.setuptools.package-data]
"powerworld_tplan_tools" = ["data/*.csv"]